name: Ruby

on:
  push:
    branches:
      - '**'

  pull_request:

  schedule:
  - cron: "21 3 * * *"

jobs:
  build:
    name: Ruby ${{ matrix.ruby }} (${{ matrix.os }})${{ matrix.net_http && format(', net-http {0}', matrix.net_http) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4', '4.0', '4.1.0-preview1']
        # '' resolves the latest net-http allowed by the gemspec. It must
        # be a matrix value so the include below adds a new job instead
        # of being merged into the existing Ruby 3.4 one.
        net_http: ['']
        experimental: [false]
        exclude:
        # not all old ruby versions are available with ubuntu-26.04
        - os: ubuntu-26.04
          ruby: '3.0'
        - os: ubuntu-26.04
          ruby: '3.1'
        - os: ubuntu-26.04
          ruby: '3.2'
        include:
        # exercise the oldest net-http release allowed by the gemspec,
        # Ruby 3.4 ships it as a default gem
        - os: ubuntu-24.04
          ruby: '3.4'
          net_http: '~> 0.6.0'
          experimental: false
        - os: ubuntu-24.04
          ruby: head
          experimental: true
        - os: ubuntu-26.04
          ruby: head
          experimental: true

    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    env:
      NET_HTTP_VERSION: ${{ matrix.net_http }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run integration tests
      run: bundle exec rake integration
    - name: Run the default task
      run: bundle exec rake
