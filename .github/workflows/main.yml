name: Ruby

on:
  push:
    branches:
      - '**'

  pull_request:

  schedule:
  - cron: "21 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - ruby: '3.0'
          experimental: false
        - ruby: '3.1'
          experimental: false
        - ruby: '3.2'
          experimental: false
        - ruby: '3.3'
          experimental: false
        - ruby: '3.4'
          experimental: false
        - ruby: '4.0'
          experimental: false
        - ruby: head
          experimental: true

    continue-on-error: ${{ matrix.experimental }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run integration tests
      run: bundle exec rake integration
    - name: Run the default task
      run: bundle exec rake

  ml-dsa:
    name: ML-DSA-44 (requires OpenSSL 3.5+)
    runs-on: ubuntu-latest
    # ML-DSA (FIPS 204) needs OpenSSL 3.5+, which ubuntu-latest's system
    # libssl doesn't provide yet. Debian trixie ships OpenSSL 3.5+, so this
    # job runs the full suite (ML-DSA specs included) in that container
    # instead of via ruby/setup-ruby's matrix above.
    container: debian:trixie-slim

    steps:
    - name: Install Ruby and build dependencies
      run: |
        apt-get update -qq
        apt-get install -y -qq ruby ruby-dev build-essential libssl-dev git pkg-config
        gem install --no-document bundler
    - uses: actions/checkout@v5
    - name: Work around git's dubious ownership check inside the container
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install gem dependencies
      run: bundle install
    - name: Run the default task
      run: bundle exec rake
