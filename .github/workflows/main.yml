name: Ruby

on:
  push:
    branches:
      - '**'

  pull_request:

  schedule:
  - cron: "21 3 * * *"

jobs:
  build:
    name: Ruby ${{ matrix.ruby }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        experimental: [false]
        exclude:
        # not all old ruby versions are available with ubuntu-26.04
        - os: ubuntu-26.04
          ruby: '3.0'
        - os: ubuntu-26.04
          ruby: '3.1'
        - os: ubuntu-26.04
          ruby: '3.2'
        include:
        - os: ubuntu-24.04
          ruby: head
          experimental: true
        - os: ubuntu-26.04
          ruby: head
          experimental: true

    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run integration tests
      run: bundle exec rake integration
    - name: Run the default task
      run: bundle exec rake
